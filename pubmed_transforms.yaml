build:
  namespace: pubmed
  package_name: pubmed_proto      # import module (must be a valid identifier)
  distribution_name: pubmed-proto # [project] name on PyPI (kebab, for consistency)
  version: "0.3.0"
  description: "Typed protobuf + pydantic models and converters for NLM PubMed XML."
  license: MIT                    # SPDX; do NOT also add a License :: classifier (PEP 639)
  readme: README.md               # resolved relative to this config file (repo root)
  license_file: LICENSE
  authors:
    - name: "Centre for Population Genomics"
  keywords: [pubmed, ncbi, protobuf, pydantic, xml, bioinformatics]
  urls:
    Repository: "https://github.com/populationgenomics/pubmed-proto"
    Issues: "https://github.com/populationgenomics/pubmed-proto/issues"
  classifiers:
    - "Development Status :: 3 - Alpha"
    - "Intended Audience :: Science/Research"
    - "Operating System :: OS Independent"
    - "Programming Language :: Python :: 3"
    - "Programming Language :: Python :: 3.11"
    - "Programming Language :: Python :: 3.12"
    - "Programming Language :: Python :: 3.13"
    - "Topic :: Scientific/Engineering :: Bio-Informatics"
    - "Typing :: Typed"

# ── Types to drop entirely ────────────────────────────────────────────────────
# Admin / structural (declared in DTD so the converter can consume and discard them)
# Inline markup (consumed by serialize_content)
drop_types:
  # Deletion notices (PMIDs withdrawn from a set)
  - DeleteDocument
  - DeleteCitation

  # MedlineCitation admin fields
  - DateCompleted
  - MedlineJournalInfo
  - ChemicalList
  - SupplMeshList
  - CommentsCorrectionsList
  - GeneSymbolList
  - PersonalNameSubjectList
  - NumberOfReferences
  - OtherAbstract
  - CoiStatement
  - SpaceFlightMission
  - InvestigatorList
  - GeneralNote
  - CitationSubset

  # Article admin fields
  - Pagination
  - Language
  - DataBankList
  - VernacularTitle
  - ArticleDate

  # PubmedData admin fields
  - History
  - ObjectList

  # Inline markup
  - B
  - I
  - Sub
  - Sup
  - U

# ── Field-level drops ────────────────────────────────────────────────────────
# Drop the URL field from AbstractText (rarely populated, complex attrs).
drop_fields:
  AbstractText:
    - url
  ReferenceList:
    - title
    - reference_list
  DescriptorName:
    - value
  QualifierName:
    - value

# ── Coercions ────────────────────────────────────────────────────────────────
coerce_to_bool: true

coerce_to_timestamp:
  - PubDate
  - DateRevised
  - ContributionDate
  - BeginningDate
  - EndingDate

# ── Structural simplifications ───────────────────────────────────────────────
inline_wrappers: true
flatten_list_wrappers: true

# ── Rich-text serialization ───────────────────────────────────────────────────
serialize_content:
  ArticleTitle: markdown
  AbstractText: markdown
  Keyword: markdown
  CollectiveName: markdown
  Citation: markdown
  BookTitle: markdown
  CollectionTitle: markdown
  SectionTitle: markdown
