[project]
name = "pubmed-proto-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Distribution is `xsd-former` on PyPI; it provides the `xsdformer` CLI.
dev = ["xsd-former==1.0.0"]
# The round-trip test builds the package and imports it, so it needs the
# generated package's runtime deps alongside pytest.
test = [
  "xsd-former==1.0.0",
  "pytest",
  "lxml",
  "protobuf>=6.32.1",
  "pydantic>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
